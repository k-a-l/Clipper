name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff (correctness rules)
        run: uvx ruff check clipper tests
      - name: Shell installer syntax
        run: sh -n scripts/install.sh

  secrets-scan:
    # Fails the build if anything that looks like a key or token is committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      # setup-uv with python-version creates and activates a virtualenv for the following steps
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: clipper --help
        run: clipper --help
      - name: Tests
        run: pytest -q

  installer:
    # The real one-line install, from this checkout, on all three systems.
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - name: install.sh (macOS / Linux)
        if: runner.os != 'Windows'
        env:
          CLIPPER_SKIP_SYSTEM: "1"
          CLIPPER_HOME: ${{ runner.temp }}/clipper-home
        run: |
          sh scripts/install.sh
          "$HOME/.local/bin/clipper" --help
          grep -q '^TOKEN_ENCRYPTION_KEY=.\{44\}$' "$CLIPPER_HOME/.env"
      - name: install.ps1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CLIPPER_SKIP_SYSTEM: "1"
          CLIPPER_HOME: ${{ runner.temp }}\clipper-home
        run: |
          ./scripts/install.ps1
          & "$env:USERPROFILE\.local\bin\clipper.exe" --help
          if (-not (Select-String -Path "$env:CLIPPER_HOME\.env" -Pattern '^TOKEN_ENCRYPTION_KEY=.{44}$')) { exit 1 }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: clipper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: docker run --rm clipper:ci --help
